# Confere o estilo e roda os testes a cada pull request e a cada
# mudança na main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# O pipeline só precisa ler o código, nunca alterar o repositório.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Baixa o código do repositório para o runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Instala a mesma versão do Python usada no projeto.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.15"

      - run: python -m pip install --group dev
      - run: ruff check .
      - run: pytest -v